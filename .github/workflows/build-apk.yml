name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # В репозитории лежит только Dart-код. Android-обвязку создаём на лету.
      - name: Generate Android project
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp -r lib /tmp/lib.bak
          flutter create . --platforms=android --project-name taskflow --org ru.taskflow
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          rm -rf lib && cp -r /tmp/lib.bak lib
          rm -rf test
          sed -i 's|android:label="[^"]*"|android:label="Задачник"|' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (не блокирует сборку)
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk taskflow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: taskflow-apk
          path: taskflow.apk

      - name: Publish GitHub Release (только для тегов vX.Y)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: taskflow.apk
